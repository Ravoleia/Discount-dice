<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ارمِ النرد واربح خصمك</title>

<style>
body {
  font-family: Arial, sans-serif;
  text-align: center;
  background: linear-gradient(135deg,#000,#333);
  color: white;
  padding-top: 50px;
}

.container {
  background: white;
  color: black;
  padding: 30px;
  border-radius: 20px;
  max-width: 400px;
  margin: auto;
  box-shadow: 0 0 30px rgba(0,0,0,0.3);
}

.dice {
  width: 130px;
  height: 130px;
  margin: 25px auto;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  font-weight: bold;
  background: black;
  color: white;
  border-radius: 20px;
  transition: transform 1.2s ease;
}

button {
  padding: 14px 30px;
  font-size: 18px;
  background: black;
  color: white;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}

button:disabled {
  background: grey;
}

.result {
  margin-top: 20px;
  font-size: 20px;
  font-weight: bold;
}

.note {
  font-size: 13px;
  color: grey;
  margin-top: 10px;
}

.confetti {
  font-size: 30px;
  animation: pop 0.6s ease forwards;
}

@keyframes pop {
  0% { transform: scale(0); }
  80% { transform: scale(1.2); }
  100% { transform: scale(1); }
}
</style>
</head>

<body>

<div class="container">
  <h2>🎲 ارْمِ النرد واربح خصمك</h2>
  <p>الخصومات المتاحة: 15% | 20% | 30% | 50% | 100%</p>

  <div class="dice" id="dice">؟</div>

  <button id="rollBtn">ارمِ الآن</button>

  <div class="result" id="result"></div>
  <div class="note">* الخصم غير شامل التوصيل</div>
</div>

<audio id="rollSound">
  <source src="https://assets.mixkit.co/active_storage/sfx/2018/2018-preview.mp3" type="audio/mpeg">
</audio>

<script>
const dice = document.getElementById("dice");
const button = document.getElementById("rollBtn");
const result = document.getElementById("result");
const sound = document.getElementById("rollSound");

if(localStorage.getItem("rolled")) {
  button.disabled = true;
  dice.innerHTML = localStorage.getItem("discountValue");
  result.innerHTML = "لقد استخدمت محاولتك مسبقًا 🎯";
}

button.addEventListener("click", function() {

  sound.play();

  dice.style.transform = "rotate(1440deg)";

  setTimeout(() => {

    let rand = Math.random() * 100;
    let selectedDiscount;

    if (rand < 30) {
      selectedDiscount = "15%";
    } else if (rand < 60) {
      selectedDiscount = "20%";
    } else if (rand < 80) {
      selectedDiscount = "30%";
    } else if (rand < 95) {
      selectedDiscount = "50%";
    } else {
      selectedDiscount = "100%";
    }

    dice.innerHTML = selectedDiscount;

    if(selectedDiscount === "100%") {
      result.innerHTML = "<span class='confetti'>🎉🎉🎉 JACKPOT! خصم 100% 🎉🎉🎉</span>";
    } else {
      result.innerHTML = "🎉 مبروك! حصلت على خصم " + selectedDiscount;
    }

    localStorage.setItem("rolled", "true");
    localStorage.setItem("discountValue", selectedDiscount);
    button.disabled = true;

  }, 1200);

});
</script>

</body>
</html>
