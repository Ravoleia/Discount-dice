<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Ravoleia</title>

<style>

body{
    font-family: Arial, sans-serif;
    text-align: center;
    background: linear-gradient(135deg,#000,#222);
    color:white;
    padding-top:60px;
    margin:0;
}

.logo{
    font-size:40px;
    font-weight:bold;
    margin-bottom:40px;
}

.container{
    background:white;
    color:black;
    padding:30px;
    border-radius:20px;
    width:90%;
    max-width:400px;
    margin:auto;
    box-shadow:0 0 30px rgba(0,0,0,0.3);
}

.dice{
    width:130px;
    height:130px;
    margin:25px auto;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:26px;
    font-weight:bold;
    background:black;
    color:white;
    border-radius:20px;
    transition:transform 1.2s ease;
}

button{
    padding:14px 30px;
    font-size:18px;
    background:black;
    color:white;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

button:disabled{
    background:grey;
}

.result{
    margin-top:20px;
    font-size:20px;
    font-weight:bold;
}

.note{
    font-size:13px;
    color:grey;
    margin-top:10px;
}

</style>
</head>

<body>

<div class="logo">Ravoleia</div>

<div class="container">

<h2>🎲 ارْمِ النرد واربح خصمك</h2>
<p>الخصومات المتاحة: 20 | 30 | 40 | 50 | 100</p>

<div class="dice" id="dice">؟</div>

<button id="rollBtn">ارمِ الآن</button>

<div class="result" id="result"></div>

<div class="note">* الخصم غير شامل التوصيل</div>

</div>

<audio id="rollSound">
<source src="https://assets.mixkit.co/active_storage/sfx/2018/2018-preview.mp3">
</audio>

<script>

const dice=document.getElementById("dice");
const button=document.getElementById("rollBtn");
const result=document.getElementById("result");
const sound=document.getElementById("rollSound");

if(localStorage.getItem("rolled")){
    button.disabled=true;
    dice.innerHTML=localStorage.getItem("discountValue");
    result.innerHTML="لقد استخدمت محاولتك مسبقًا 🎯";
}

button.addEventListener("click",function(){

    sound.play();
    dice.style.transform="rotate(1440deg)";

    setTimeout(()=>{

        let rand=Math.random();

        let selectedDiscount;

        if(rand < 0.25){
            selectedDiscount="20%";
        }else if(rand < 0.50){
            selectedDiscount="30%";
        }else if(rand < 0.75){
            selectedDiscount="40%";
        }else{
            selectedDiscount="50%";
        }

        dice.innerHTML=selectedDiscount;

        result.innerHTML="🎉 مبروك! حصلت على خصم "+selectedDiscount;

        localStorage.setItem("rolled","true");
        localStorage.setItem("discountValue",selectedDiscount);

        button.disabled=true;

    },1200);

});

</script>

</body>
</html>
