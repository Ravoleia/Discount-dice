<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ارمِ النرد واربح خصمك</title>
<style>
body {
  font-family: Arial, sans-serif;
  text-align: center;
  background: #f5f5f5;
  padding: 40px;
}
.container {
  background: white;
  padding: 30px;
  border-radius: 15px;
  max-width: 400px;
  margin: auto;
  box-shadow: 0 0 15px rgba(0,0,0,0.1);
}
button {
  padding: 15px 30px;
  font-size: 18px;
  background: black;
  color: white;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}
button:disabled {
  background: grey;
}
.result {
  margin-top: 20px;
  font-size: 22px;
  font-weight: bold;
}
</style>
</head>
<body>

<div class="container">
  <h2>🎲 ارْمِ النرد واربح خصمك</h2>
  <p>لديك محاولة واحدة فقط!</p>
  <button id="rollBtn">ارمِ الآن</button>
  <div class="result" id="result"></div>
</div>

<script>
const button = document.getElementById("rollBtn");
const resultDiv = document.getElementById("result");

if(localStorage.getItem("rolled")) {
  button.disabled = true;
  resultDiv.innerHTML = "لقد استخدمت محاولتك مسبقًا 🎯";
}

button.addEventListener("click", function() {
  const discounts = ["5%", "10%", "15%", "20%", "25%", "طلب مجاني 🎁"];
  const randomIndex = Math.floor(Math.random() * discounts.length);
  const discount = discounts[randomIndex];

  resultDiv.innerHTML = "🎉 مبروك! حصلت على خصم " + discount;
  localStorage.setItem("rolled", "true");
  button.disabled = true;
});
</script>

</body>
</html>
